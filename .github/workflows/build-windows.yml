name: Build TextAnimator Windows Installer

on:
  push:
    branches: [main]
    paths:
      - 'TextAnimator-v3.2.0-GitHub-Installer-Source.zip'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11 x64
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Extract uploaded source package
        shell: pwsh
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE 'TextAnimator-v3.2.0-GitHub-Installer-Source.zip'
          if (!(Test-Path $archive)) { throw "Source archive not found: $archive" }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $env:GITHUB_WORKSPACE 'source') -Force
          if (!(Test-Path 'source\prepare_windows.ps1')) { throw 'The ZIP must contain prepare_windows.ps1 at its root.' }

      - name: Pin pip below 25.3 for pip-tools 7.5.0 compatibility
        shell: pwsh
        run: |
          $script = 'source\prepare_windows.ps1'
          $raw = Get-Content -LiteralPath $script -Raw
          if ($raw -notmatch 'pip<27') { throw 'Expected pip<27 pin not found in prepare_windows.ps1; review the build script before proceeding.' }
          $raw = $raw.Replace('pip<27', 'pip<25')
          Set-Content -LiteralPath $script -Value $raw -Encoding utf8

      - name: Keep pip-tools out of the hash-locked build dependencies
        shell: pwsh
        run: |
          $inputs = Get-ChildItem -Path 'source' -Filter 'requirements*.in' -File -Recurse
          if (!$inputs) { throw 'No requirements*.in input files were found in the source package.' }
          $removed = 0
          foreach ($file in $inputs) {
            $lines = Get-Content -LiteralPath $file.FullName
            $filtered = @($lines | Where-Object { $_ -notmatch '^\s*pip-tools(?:\s|[<=>!~\[]|$)' })
            if ($filtered.Count -lt $lines.Count) {
              Set-Content -LiteralPath $file.FullName -Value $filtered -Encoding utf8
              Write-Host "Removed pip-tools from $($file.FullName)"
              $removed++
            }
          }
          if ($removed -eq 0) { throw 'No pip-tools requirement was found in the source requirement inputs; refusing to continue with an unsafe lock.' }
          Write-Host 'pip-tools remains installed in the preparation environment to compile lock files, but is excluded from the final build dependency locks.'
          $buildInputs = Get-ChildItem -Path 'source' -Filter '*build*.in' -File -Recurse
          if (!$buildInputs) { throw 'No build requirements input file was found for pinning setuptools.' }
          foreach ($file in $buildInputs) {
            $content = Get-Content -LiteralPath $file.FullName
            if (!($content -match '^\s*setuptools(?:\s|[<=>!~\[]|$)')) {
              Add-Content -LiteralPath $file.FullName -Value 'setuptools==80.9.0' -Encoding utf8
              Write-Host "Pinned setuptools for hash-locked PyInstaller build: $($file.FullName)"
            }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }

      - name: Resolve and download pinned Windows wheels
        shell: pwsh
        working-directory: source
        run: ./prepare_windows.ps1

      - name: Build and test TextAnimator
        shell: pwsh
        working-directory: source
        run: ./build_windows.ps1

      - name: Build persistent Windows installer
        shell: pwsh
        working-directory: source
        run: ./build_installer.ps1

      - name: Verify installer output
        shell: pwsh
        working-directory: source
        run: |
          $setup = Get-ChildItem -Path 'installer-output' -Filter '*Setup.exe' -Recurse | Select-Object -First 1
          if (!$setup) { throw 'Installer EXE was not produced.' }
          if ($setup.Length -lt 10MB) { throw "Installer is unexpectedly small: $($setup.Length) bytes" }
          Write-Host "Installer: $($setup.FullName)"
          Write-Host "Size: $([math]::Round($setup.Length / 1MB, 2)) MB"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: TextAnimator-Windows-Setup
          path: source/installer-output/*Setup.exe
          if-no-files-found: error
          retention-days: 30
