name: Build TextAnimator Windows Installer

on:
  push:
    branches: [main, 'feature/pro-presets-action-calm-sad']
    paths:
      - 'TextAnimator-v3.2.0-GitHub-Installer-Source.zip'
      - '.github/workflows/build-windows.yml'
      - 'source-overlay/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11 x64
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Extract uploaded source package
        shell: pwsh
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE 'TextAnimator-v3.2.0-GitHub-Installer-Source.zip'
          if (!(Test-Path $archive)) { throw "Source archive not found: $archive" }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $env:GITHUB_WORKSPACE 'source') -Force
          if (!(Test-Path 'source\prepare_windows.ps1')) { throw 'The ZIP must contain prepare_windows.ps1 at its root.' }


      - name: Apply six professional mood presets
        shell: pwsh
        run: |
          $overlay = 'https://raw.githubusercontent.com/n4sr77/text-animator/feature/pro-presets-action-calm-sad/source-overlay'
          New-Item -ItemType Directory -Force -Path 'source\text_animator\presets' | Out-Null
          Invoke-WebRequest -Uri "$overlay/text_animator/presets/mood.py" -OutFile 'source\text_animator\presets\mood.py'
          Invoke-WebRequest -Uri "$overlay/tests/test_mood_presets.py" -OutFile 'source\tests\test_mood_presets.py'
          Invoke-WebRequest -Uri "$overlay/text_animator/batch_ui.py" -OutFile 'source\text_animator\batch_ui.py'
          Invoke-WebRequest -Uri "$overlay/text_animator/video_preview.py" -OutFile 'source\text_animator\video_preview.py'
          Invoke-WebRequest -Uri "$overlay/tests/test_batch_preview_ui.py" -OutFile 'source\tests\test_batch_preview_ui.py'
          $registry = 'source\text_animator\presets\__init__.py'
          $raw = Get-Content -LiteralPath $registry -Raw
          $importAnchor = 'from .pulse_glow import PulseGlowPreset'
          if (!$raw.Contains($importAnchor)) { throw 'Preset registry import anchor missing.' }
          $imports = $importAnchor + "`r`nfrom .mood import ImpactStrikePreset, CinematicRushPreset, SoftFlowPreset, SerenityPreset, MelancholyFadePreset, RainyMemoriesPreset"
          $raw = $raw.Replace($importAnchor, $imports)
          $dictAnchor = '    "pulse_glow": PulseGlowPreset(),'
          if (!$raw.Contains($dictAnchor)) { throw 'Preset registry dictionary anchor missing.' }
          $dictAdd = $dictAnchor + "`r`n    'impact_strike': ImpactStrikePreset(),`r`n    'cinematic_rush': CinematicRushPreset(),`r`n    'soft_flow': SoftFlowPreset(),`r`n    'serenity': SerenityPreset(),`r`n    'melancholy_fade': MelancholyFadePreset(),`r`n    'rainy_memories': RainyMemoriesPreset(),"
          $raw = $raw.Replace($dictAnchor, $dictAdd)
          $labelAnchor = '    "pulse_glow": "Pulse Glow",'
          if (!$raw.Contains($labelAnchor)) { throw 'Preset label anchor missing.' }
          $labelAdd = $labelAnchor + "`r`n    'impact_strike': 'Action · Impact Strike',`r`n    'cinematic_rush': 'Action · Cinematic Rush',`r`n    'soft_flow': 'Calm · Soft Flow',`r`n    'serenity': 'Calm · Serenity',`r`n    'melancholy_fade': 'Sad · Melancholy Fade',`r`n    'rainy_memories': 'Sad · Rainy Memories',"
          $raw = $raw.Replace($labelAnchor, $labelAdd)
          Set-Content -LiteralPath $registry -Value $raw -Encoding utf8
          $gui = 'source\text_animator\gui.py'
          $guiRaw = Get-Content -LiteralPath $gui -Raw
          $guiRaw = $guiRaw.Replace('10 animation presets', '17 animation presets')
          $guiRaw = $guiRaw.Replace('11 animation presets', '17 animation presets')
          Set-Content -LiteralPath $gui -Value $guiRaw -Encoding utf8
          if (!$guiRaw.Contains('from .batch_ui import install_batch_ui')) {
            Add-Content -LiteralPath $gui -Value "`r`nfrom .batch_ui import install_batch_ui as _install_batch_ui`r`n_install_batch_ui(TextAnimatorApp)" -Encoding utf8
          }
          $readme = 'source\README.md'
          if (Test-Path $readme) {
            $readmeRaw = Get-Content -LiteralPath $readme -Raw
            $readmeRaw = $readmeRaw.Replace('11 animation presets', '17 animation presets')
            Set-Content -LiteralPath $readme -Value $readmeRaw -Encoding utf8
          }
          Write-Host 'Registered six new presets: two Action, two Calm and two Sad.'

      - name: Download real Arabic font binaries and bundle them
        shell: pwsh
        run: |
          $fontDir = Join-Path $env:GITHUB_WORKSPACE 'source\assets\fonts'
          $tempRoot = Join-Path $env:RUNNER_TEMP 'textanimator-fonts'
          New-Item -ItemType Directory -Force -Path $fontDir, $tempRoot | Out-Null

          # Google Fonts' raw GitHub binary URLs can return Git-LFS pointer files.
          # Download the upstream release archives instead, then extract the real TTFs.
          $families = @(
            @{
              Name = 'NotoSansArabic'
              File = 'NotoSansArabic[wdth,wght].ttf'
              Archive = 'https://github.com/notofonts/arabic/releases/download/NotoSansArabic-v2.012/NotoSansArabic-v2.012.zip'
              License = 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosansarabic/OFL.txt'
            },
            @{
              Name = 'NotoNaskhArabic'
              File = 'NotoNaskhArabic[wght].ttf'
              Archive = 'https://github.com/notofonts/arabic/releases/download/NotoNaskhArabic-v2.021/NotoNaskhArabic-v2.021.zip'
              License = 'https://raw.githubusercontent.com/google/fonts/main/ofl/notonaskharabic/OFL.txt'
            },
            @{
              Name = 'NotoKufiArabic'
              File = 'NotoKufiArabic[wght].ttf'
              Archive = 'https://github.com/notofonts/arabic/releases/download/NotoKufiArabic-v2.109/NotoKufiArabic-v2.109.zip'
              License = 'https://raw.githubusercontent.com/google/fonts/main/ofl/notokufiarabic/OFL.txt'
            }
          )

          foreach ($family in $families) {
            $archivePath = Join-Path $tempRoot "$($family.Name).zip"
            $extractDir = Join-Path $tempRoot $family.Name
            Invoke-WebRequest -Uri $family.Archive -OutFile $archivePath
            if ((Get-Item $archivePath).Length -lt 100000) {
              throw "The upstream font archive is unexpectedly small: $($family.Name)"
            }
            Expand-Archive -LiteralPath $archivePath -DestinationPath $extractDir -Force
            $font = Get-ChildItem -Path $extractDir -Recurse -File |
              Where-Object { $_.Name -ceq $family.File } |
              Select-Object -First 1
            if (!$font) { throw "The TTF file was not found in the release archive: $($family.File)" }

            $target = Join-Path $fontDir $family.File
            Copy-Item -LiteralPath $font.FullName -Destination $target -Force
            $bytes = [System.IO.File]::ReadAllBytes($target)
            $signature = [BitConverter]::ToString($bytes, 0, 4)
            if ($bytes.Length -lt 100000 -or $signature -notin @('00-01-00-00', '4F-54-54-4F')) {
              throw "Invalid or incomplete TTF binary: $($family.Name) ($($bytes.Length) bytes, $signature)"
            }

            $licensePath = Join-Path $fontDir "$($family.Name)-OFL.txt"
            Invoke-WebRequest -Uri $family.License -OutFile $licensePath
            if ((Get-Item $licensePath).Length -lt 1000) {
              throw "The OFL license download is incomplete: $($family.Name)"
            }
            Write-Host "Bundled $($family.Name): $($bytes.Length) bytes"
          }

          $fontsPy = 'source\text_animator\fonts.py'
          $raw = Get-Content -LiteralPath $fontsPy -Raw
          $rootsAnchor = '_SEARCH_ROOTS = ['
          if (!$raw.Contains($rootsAnchor)) { throw 'Font search roots anchor missing.' }
          if (!$raw.Contains('Path(__file__).resolve().parents[1] / "assets" / "fonts"')) {
            $roots = @(
              '    Path(__file__).resolve().parents[1] / "assets" / "fonts",',
              '    Path(os.environ.get("WINDIR", r"C:\Windows")) / "Fonts",',
              '    Path(os.environ.get("LOCALAPPDATA", str(Path.home()))) / "Microsoft" / "Windows" / "Fonts",'
            ) -join [Environment]::NewLine
            $raw = $raw.Replace($rootsAnchor, $rootsAnchor + [Environment]::NewLine + $roots)
          }
          $preferredAnchor = '    "Noto Sans",'
          if (!$raw.Contains($preferredAnchor)) { throw 'Preferred font family anchor missing.' }
          if (!$raw.Contains('"Noto Sans Arabic"')) {
            $preferred = $preferredAnchor + [Environment]::NewLine +
              '    "Noto Sans Arabic",' + [Environment]::NewLine +
              '    "Noto Naskh Arabic",' + [Environment]::NewLine +
              '    "Noto Kufi Arabic",'
            $raw = $raw.Replace($preferredAnchor, $preferred)
          }
          $defaultAnchor = 'for preferred in ["DejaVu Sans Bold", "Liberation Sans Bold", "Anton", "Oswald"]:'
          if ($raw.Contains($defaultAnchor)) {
            $raw = $raw.Replace(
              $defaultAnchor,
              'for preferred in ["DejaVu Sans Bold", "Liberation Sans Bold", "Anton", "Oswald", "NotoSansArabic[wdth,wght]"]:'
            )
          }
          Set-Content -LiteralPath $fontsPy -Value $raw -Encoding utf8

          $spec = 'source\TextAnimator.spec'
          $specRaw = Get-Content -LiteralPath $spec -Raw
          if (!$specRaw.Contains('datas = []')) { throw 'PyInstaller datas anchor missing.' }
          $specRaw = $specRaw.Replace(
            'datas = []',
            'datas = [(str(ROOT / "assets" / "fonts"), "assets/fonts")]'
          )
          Set-Content -LiteralPath $spec -Value $specRaw -Encoding utf8

          Push-Location source
          try {
            & py -3.11 -c "from pathlib import Path; from text_animator.fonts import discover_fonts, get_default_font; fonts=discover_fonts(); print('Discovered bundled fonts:', list(fonts)); assert len(fonts) >= 3, f'Expected at least 3 bundled fonts, found {len(fonts)}'; assert all(Path(path).is_file() for path in fonts.values()); name, path=get_default_font(); print('Default font:', name, path); assert Path(path).is_file()"
            if ($LASTEXITCODE -ne 0) { throw 'Bundled font discovery validation failed.' }
          } finally { Pop-Location }

          Write-Host 'Arabic fonts are bundled and discoverable; their licenses are included.'

      - name: Diagnose packaged font discovery and build configuration
        shell: pwsh
        run: |
          Write-Host '=== SOURCE FILE TREE ==='
          Get-ChildItem -Path source -Recurse -File | ForEach-Object { $_.FullName.Substring((Resolve-Path source).Path.Length + 1) }
          Write-Host '=== FONT MODULES ==='
          $fontFiles = Get-ChildItem -Path source -Recurse -File | Where-Object { $_.Name -match 'font|spec|installer|build_windows' -and $_.Extension -in '.py','.spec','.ps1','.iss' }
          foreach ($file in $fontFiles) {
            Write-Host "=== FILE: $($file.FullName) ==="
            if ($file.Name -match 'fonts?\.py|\.spec$|build_windows|build_installer') {
              Get-Content -LiteralPath $file.FullName
            }
          }

      - name: Make FFmpeg regression fixture Windows-compatible
        shell: pwsh
        run: |
          $test = 'source\tests\test_media_audio_replace.py'
          if (!(Test-Path $test)) { throw "Expected media regression test not found: $test" }
          $raw = Get-Content -LiteralPath $test -Raw
          $old = '    output = tmp_path / "out.mp4"'
          if (!$raw.Contains($old)) { throw 'Expected FFmpeg test fixture anchor was not found.' }
          $insert = $old + "`r`n    fake_ffmpeg = tmp_path / 'ffmpeg.exe'`r`n    fake_ffmpeg.write_bytes(b'')"
          $raw = $raw.Replace($old, $insert)
          if (!$raw.Contains('return_value="/usr/bin/ffmpeg"')) { throw 'Expected POSIX-only FFmpeg mock was not found.' }
          $raw = $raw.Replace('return_value="/usr/bin/ffmpeg"', 'return_value=str(fake_ffmpeg)')
          Set-Content -LiteralPath $test -Value $raw -Encoding utf8
          Write-Host 'Updated FFmpeg test fixture to use a real temporary Windows path.'

      - name: Pin pip below 25.3 for pip-tools 7.5.0 compatibility
        shell: pwsh
        run: |
          $script = 'source\prepare_windows.ps1'
          $raw = Get-Content -LiteralPath $script -Raw
          if ($raw -notmatch 'pip<27') { throw 'Expected pip<27 pin not found in prepare_windows.ps1; review the build script before proceeding.' }
          $raw = $raw.Replace('pip<27', 'pip<25')
          Set-Content -LiteralPath $script -Value $raw -Encoding utf8

      - name: Keep pip-tools out of the hash-locked build dependencies
        shell: pwsh
        run: |
          $inputs = Get-ChildItem -Path 'source' -Filter 'requirements*.in' -File -Recurse
          if (!$inputs) { throw 'No requirements*.in input files were found in the source package.' }
          $removed = 0
          foreach ($file in $inputs) {
            $lines = Get-Content -LiteralPath $file.FullName
            $filtered = @($lines | Where-Object { $_ -notmatch '^\s*pip-tools(?:\s|[<=>!~\[]|$)' })
            if ($filtered.Count -lt $lines.Count) {
              Set-Content -LiteralPath $file.FullName -Value $filtered -Encoding utf8
              Write-Host "Removed pip-tools from $($file.FullName)"
              $removed++
            }
          }
          if ($removed -eq 0) { throw 'No pip-tools requirement was found in the source requirement inputs; refusing to continue with an unsafe lock.' }
          Write-Host 'pip-tools remains installed in the preparation environment to compile lock files, but is excluded from the final build dependency locks.'
          $buildInputs = Get-ChildItem -Path 'source' -Filter '*build*.in' -File -Recurse
          if (!$buildInputs) { throw 'No build requirements input file was found for pinning setuptools.' }
          foreach ($file in $buildInputs) {
            $content = Get-Content -LiteralPath $file.FullName
            if (!($content -match '^\s*setuptools(?:\s|[<=>!~\[]|$)')) {
              Add-Content -LiteralPath $file.FullName -Value 'setuptools==81.0.0' -Encoding utf8
              Write-Host "Pinned setuptools for hash-locked PyInstaller build: $($file.FullName)"
            }
          }

      - name: Include unsafe build tools in the hash-locked wheel manifest
        shell: pwsh
        run: |
          $script = 'source\prepare_windows.ps1'
          $raw = Get-Content -LiteralPath $script -Raw
          if ($raw -notmatch '--generate-hashes') { throw 'Expected pip-compile --generate-hashes option was not found.' }
          $raw = $raw.Replace('--generate-hashes', '--generate-hashes --allow-unsafe')
          Set-Content -LiteralPath $script -Value $raw -Encoding utf8
          Write-Host 'Enabled pip-compile --allow-unsafe so setuptools is pinned and hashed in the build lock.'
          
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }

      - name: Resolve and download pinned Windows wheels
        shell: pwsh
        working-directory: source
        run: |
          $constraints = Join-Path $env:GITHUB_WORKSPACE 'source\\wheel-constraints.txt'
          Set-Content -LiteralPath $constraints -Value 'setuptools==81.0.0' -Encoding utf8
          $env:PIP_CONSTRAINT = $constraints
          ./prepare_windows.ps1

      - name: Install FFmpeg for media regression tests
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed.' }
          $ffmpeg = Get-Command ffmpeg.exe -ErrorAction Stop
          $ffmpegDir = Split-Path -Parent $ffmpeg.Source
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $ffmpegDir
          & $ffmpeg.Source -version

      - name: Build and test TextAnimator
        shell: pwsh
        working-directory: source
        run: ./build_windows.ps1

      - name: Smoke-test packaged GUI startup
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'source\dist\TextAnimator\TextAnimator.exe'
          if (!(Test-Path $exe)) { throw "Packaged executable not found: $exe" }
          $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path -Parent $exe) -PassThru
          try {
            Start-Sleep -Seconds 10
            $process.Refresh()
            if ($process.HasExited) {
              throw "The packaged GUI exited during startup smoke test (exit code $($process.ExitCode))."
            }
            Write-Host "GUI remained running for 10 seconds (PID $($process.Id))."
          } finally {
            $process.Refresh()
            if (!$process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              Wait-Process -Id $process.Id -Timeout 5 -ErrorAction SilentlyContinue
            }
          }

      - name: Build persistent Windows installer
        shell: pwsh
        working-directory: source
        run: ./build_installer.ps1

      - name: Verify installer output
        shell: pwsh
        working-directory: source
        run: |
          $setup = Get-ChildItem -Path 'installer-output' -Filter '*Setup.exe' -Recurse | Select-Object -First 1
          if (!$setup) { throw 'Installer EXE was not produced.' }
          if ($setup.Length -lt 10MB) { throw "Installer is unexpectedly small: $($setup.Length) bytes" }
          Write-Host "Installer: $($setup.FullName)"
          Write-Host "Size: $([math]::Round($setup.Length / 1MB, 2)) MB"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: TextAnimator-Windows-Setup
          path: source/installer-output/*Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable Windows installer release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.2.0
          target_commitish: main
          name: TextAnimator v3.2.0 — Windows installer
          body: |
            Windows x64 per-user installer for TextAnimator 3.2.0.

            The installer includes the packaged Python runtime, dependencies, bundled Arabic-capable fonts, FFmpeg, and the Batch preview player. It installs under the current user's Local AppData folder and includes an uninstaller.
          files: source/installer-output/TextAnimator-v3.2.0-Setup.exe
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
